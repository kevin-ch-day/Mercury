name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MERCURY_NO_COLOR: "1"
  NO_COLOR: "1"
  COLUMNS: "120"
  MERCURY_DRY_RUN: "1"
  MERCURY_LIVE_ACTIONS: "0"
  TZ: UTC

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e ".[mariadb,dev]"

      - name: Check package metadata
        run: python -m pip check

      - name: Check runtime and test hygiene
        run: |
          python -m ruff check src tests --select F401,F841,F811,F821,B018,B023
          python -m ruff check src --select S101,S102,S301,S307,S324,S602,S605
          python -m vulture src/mercury tests --min-confidence 80

      - name: Audit runtime dependencies
        run: python -m pip_audit . --progress-spinner off

      - name: Build distribution artifacts
        run: python -m build

      - name: Run tests
        run: python -m pytest -q
        env:
          # Force offline local.toml even if a future checkout ever ships one.
          MERCURY_LOCAL_CONFIG: ${{ runner.temp }}/mercury-ci-absent-local.toml

      - name: Smoke test CLI entrypoints
        run: |
          python -m mercury.cli --help
          python -m mercury.cli backup --help
          python -m mercury.cli sync --help
          python -m mercury.cli repo --help
          python -m mercury.cli transfer --help
