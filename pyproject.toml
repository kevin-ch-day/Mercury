[project]
name = "mercury"
version = "0.1.0"
description = "Fedora-first database backup, disaster recovery, and prod-to-dev sync utility"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/kevin-ch-day/Mercury"
Repository = "https://github.com/kevin-ch-day/Mercury"
Issues = "https://github.com/kevin-ch-day/Mercury/issues"

[project.scripts]
mercury = "mercury.cli:main"

[project.optional-dependencies]
mariadb = [
    "pymysql>=1.2.3",
]
dev = [
    "pip-audit>=2.10,<3",
    "pytest>=8.0",
    "pymysql>=1.2.3",
    "ruff>=0.16",
    "vulture>=2.14,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mercury"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "uses_operator_local_config: allow reading the real config/local.toml during the test",
]
